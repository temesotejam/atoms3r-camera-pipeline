name: Import production baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-production-baseline.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the isolated development branch
        uses: actions/checkout@v4
        with:
          ref: work/latency-investigation
          fetch-depth: 0

      - name: Fetch the complete production Git history
        run: |
          git fetch --no-tags https://github.com/temesotejam/atoms3r-lateral-energy-control.git ec5faa49766187cb552523d8c234f6a6bba61224
          test "$(git rev-parse FETCH_HEAD)" = "ec5faa49766187cb552523d8c234f6a6bba61224"

      - name: Merge the production source tree without changing its behavior
        run: |
          mkdir -p docs
          git show FETCH_HEAD:README.md > docs/UPSTREAM_README.md
          git merge --allow-unrelated-histories --no-commit FETCH_HEAD || true
          if git ls-files -u | grep -q .; then
            # The project README explains the purpose of this isolated repo;
            # preserve it while retaining the upstream README as documentation.
            git checkout --ours README.md
            git add README.md
          fi
          cat > docs/UPSTREAM_BASELINE.md <<'EOF'
          # Imported production baseline

          Source repository: https://github.com/temesotejam/atoms3r-lateral-energy-control
          Source commit: ec5faa49766187cb552523d8c234f6a6bba61224
          Source branch at import: main
          Import date: 2026-11-13

          The production commit and its Git ancestry are merged into this
          isolated repository. The camera pipeline work must preserve all
          non-camera control, estimator, IMU, motor, and logging behavior.
          This imported commit is the reference for subsequent diffs.
          EOF
          git add -A
          git status --short

      - name: Run existing host regression suite
        run: bash tools/test_runtime.sh

      - name: Build the ESP32-S3 firmware
        run: |
          python3 -m pip install --user platformio
          export PATH="$HOME/.local/bin:$PATH"
          pio run

      - name: Commit imported baseline to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No baseline changes to import."
            exit 0
          fi
          git commit -m "Merge production baseline ec5faa4 with full upstream history"
          git push origin HEAD:work/latency-investigation
