name: Import production baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-production-baseline.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/latency-investigation
          fetch-depth: 0

      - name: Configure import identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch exact production baseline and ancestry
        run: |
          git fetch --no-tags https://github.com/temesotejam/atoms3r-lateral-energy-control.git ec5faa49766187cb552523d8c234f6a6bba61224
          test "$(git rev-parse FETCH_HEAD)" = "ec5faa49766187cb552523d8c234f6a6bba61224"

      - name: Merge source while excluding upstream GitHub workflows
        run: |
          mkdir -p docs
          git show FETCH_HEAD:README.md > docs/UPSTREAM_README.md
          git show FETCH_HEAD:.github/workflows/pages.yml > docs/UPSTREAM_PAGES_WORKFLOW.yml
          git merge --allow-unrelated-histories --no-commit -X ours FETCH_HEAD
          # This repository uses its own minimal CI/Pages workflows. Do not
          # import upstream workflows: the GitHub App token is not granted
          # workflow-file write permission, and production workflows target
          # the original repository's deployment environment.
          git rm -rf --ignore-unmatch .github/workflows/build.yml .github/workflows/pages.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test_madgwick_hot.py')
          s = p.read_text()
          s = s.replace("ROOT / '.github/workflows/pages.yml'", "ROOT / 'docs/UPSTREAM_PAGES_WORKFLOW.yml'")
          p.write_text(s)
          PY
          cat > docs/UPSTREAM_BASELINE.md <<'EOF'
          # Imported production baseline

          Source repository: https://github.com/temesotejam/atoms3r-lateral-energy-control
          Source commit: ec5faa49766187cb552523d8c234f6a6bba61224
          Import date: 2026-11-13

          Complete source tree and Git ancestry imported. Upstream GitHub Actions
          workflows are intentionally excluded; this repository has independent
          CI and Pages workflows. Non-camera runtime behavior is the invariant.
          EOF
          git add -A

      - name: Run original host regression suite
        run: bash tools/test_runtime.sh

      - name: Build original ESP32-S3 firmware
        run: |
          python3 -m pip install --user platformio
          export PATH="$HOME/.local/bin:$PATH"
          pio run

      - name: Commit baseline to isolated branch
        run: |
          git commit -m "Merge production baseline ec5faa4; preserve runtime unchanged"
          git push origin HEAD:work/latency-investigation
